<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de RA: 3D vs Foto vs Totem 🍣</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Motor de Realidade Aumentada do Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-4 flex flex-col items-center font-sans selection:bg-rose-500">

  <div class="w-full max-w-md">
    <!-- Voltar ao cardápio -->
    <div class="flex items-center justify-between mb-3 text-xs">
      <a href="/" class="text-zinc-400 hover:text-white flex items-center gap-1 py-1">
        <span>←</span>
        <span>Voltar ao Cardápio</span>
      </a>
      <span class="text-rose-400 font-semibold">Comparador de 3 Modos</span>
    </div>

    <header class="text-center mb-3">
      <h1 class="text-xl font-black tracking-tight">Qual visual fica melhor na mesa?</h1>
      <p class="text-zinc-400 text-xs mt-1">Toque em cada uma das 3 opções abaixo e projete na sua mesa:</p>
    </header>

    <!-- AS 3 OPÇÕES EXATAS PARA COMPARAR -->
    <div class="grid grid-cols-3 bg-zinc-900 border border-zinc-800 p-1 rounded-2xl mb-3 text-xs gap-1 shadow-inner">
      <button id="btnOpcao1" class="py-2.5 px-2 rounded-xl font-bold text-xs bg-rose-600 text-white shadow-lg transition text-center">
        1. Prato 3D (.glb)
      </button>
      <button id="btnOpcao2" class="py-2.5 px-2 rounded-xl font-medium text-xs bg-zinc-900 text-zinc-400 hover:text-white transition text-center">
        2. Foto no Prato
      </button>
      <button id="btnOpcao3" class="py-2.5 px-2 rounded-xl font-medium text-xs bg-zinc-900 text-zinc-400 hover:text-white transition text-center">
        3. Totem Display
      </button>
    </div>

    <!-- Palco 3D / Realidade Aumentada -->
    <div class="bg-gradient-to-b from-zinc-900 to-zinc-950 rounded-2xl overflow-hidden border border-zinc-800 shadow-2xl relative">
      <model-viewer
        id="visor"
        src="/models/Hot-Philadelfia.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        rotation-per-second="20deg"
        shadow-intensity="1.5"
        shadow-softness="0.5"
        exposure="1.1"
        style="width: 100%; height: 420px;">
        
        <button slot="ar-button" id="btnAr" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-black py-3 px-6 rounded-full shadow-2xl whitespace-nowrap text-xs border border-rose-400/40 cursor-pointer active:scale-95 transition">
          📱 PROJETAR NA MESA (RA)
        </button>
      </model-viewer>
    </div>

    <!-- Status da Opção Carregada -->
    <p id="status" class="text-xs text-center text-emerald-400 mt-2 font-medium">
      ✅ Opção 1: Prato 3D original (.glb). Toque no botão acima para projetar na mesa.
    </p>

    <!-- Upload de outra foto de teste -->
    <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-3.5 mt-3 text-xs text-zinc-400">
      <label class="block mb-1 font-semibold text-zinc-300">Testar com outra foto do celular (opcional):</label>
      <input type="file" id="fotoInput" accept="image/*" class="w-full text-xs text-zinc-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-zinc-800 file:text-white hover:file:bg-zinc-700 cursor-pointer" />
    </div>

    <!-- Painel de customização dos textos (visível apenas na Opção 3 Totem) -->
    <div id="painelPersonalizar" style="display: none;" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 mt-3 space-y-3 shadow-lg">
      <h2 class="text-xs font-bold text-rose-400 uppercase tracking-wider">Textos do Totem</h2>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-zinc-400 block mb-1">Nome:</label>
          <input type="text" id="nomeInput" value="Hot Philadélfia - 10 unidades" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white" />
        </div>
        <div>
          <label class="text-[11px] text-zinc-400 block mb-1">Preço:</label>
          <input type="text" id="precoInput" value="R$ 36,90" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-rose-400 font-bold" />
        </div>
      </div>

      <div>
        <label class="text-[11px] text-zinc-400 block mb-1">Descrição:</label>
        <input type="text" id="descInput" value="Arroz, Salmão, Cream Cheese, Tarê e cebolinha." class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white" />
      </div>

      <button id="btnAtualizar" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-2 rounded-xl text-xs transition">
        🔄 Atualizar Textos do Totem
      </button>
    </div>
  </div>

  <script type="module" src="/src/display.ts"></script>
</body>
</html>
